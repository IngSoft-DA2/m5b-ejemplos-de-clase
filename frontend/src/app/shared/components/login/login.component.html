<div class="login-container">
  <h2>Login</h2>
  <form (ngSubmit)="onSubmit()">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        required
        [(ngModel)]="username"
        name="username"
      />
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        required
        [(ngModel)]="password"
        name="password"
      />
    <button type="submit">Login</button>
  </form>
</div>
